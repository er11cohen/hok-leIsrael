apply plugin: 'com.android.application'

Properties properties = new Properties()
properties.load(project.rootProject.file("gradle.properties").newDataInputStream())
def $sdk = properties.getProperty("sdk") as Integer
def $minSdkVersion = properties.getProperty("minSdkVersion") as Integer
def $javaVersion = properties.getProperty("javaVersion")

android {
    namespace 'com.eran.hokleisrael'
    compileSdkVersion $sdk

    defaultConfig {
        applicationId "com.eran.hokleisrael"
        minSdk $minSdkVersion
        targetSdk $sdk
        versionCode = 10906
        versionName = "1.9.6"
        compileOptions {
            sourceCompatibility JavaVersion.toVersion($javaVersion)
            targetCompatibility JavaVersion.toVersion($javaVersion)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':utils')
    implementation 'com.android.support:support-v4:27.1.1'
    implementation 'com.google.code.gson:gson:2.2.4'
    implementation 'com.android.support:appcompat-v7:27.1.1'
}
